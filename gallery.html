<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图册 · Gallery</title>
<meta name="description" content="阿金的图册">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Noto+Sans+SC:wght@400..600&family=Noto+Serif+SC:wght@400..600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

a, button { -webkit-tap-highlight-color: transparent; outline: none; }

html { scroll-behavior: smooth; }

::selection { background: rgba(251,113,133,0.18); color: #1c1c1e; }

body {
  font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: linear-gradient(140deg, #f5d4b8 0%, #f0d4d4 25%, #d8d8e8 55%, #c8d8e8 100%);
  color: #1c1c1e;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  top: -15%; right: -8%;
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -10%; left: -5%;
  width: 40vw; height: 40vw;
  background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245,240,235,0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.05);
  padding: 0 40px;
}
.navbar-inner {
  max-width: 1040px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.nav-name { font-size: 16px; font-weight: 600; color: #1c1c1e; text-decoration: none; }
.nav-right { display: flex; align-items: center; gap: 2px; }
.nav-link {
  font-size: 14px; color: #71717a; text-decoration: none;
  padding: 7px 16px; border-radius: 8px;
  transition: background 0.2s, color 0.2s;
}
.nav-link:hover { background: rgba(255,255,255,0.5); color: #1c1c1e; }
.nav-link.active { color: #2563eb; font-weight: 500; }

.container { max-width: 1040px; margin: 0 auto; padding: 0 40px 120px; position: relative; z-index: 1; }

.hero { padding: 96px 0 48px; }
.hero h1 {
  font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
  font-size: 52px;
  font-weight: 500;
  letter-spacing: 4px;
  margin-bottom: 12px;
}
.hero .sub { font-size: 16px; color: #71717a; }

.section { margin-bottom: 72px; }
.section-head {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 28px;
}
.section-head .label {
  font-family: 'Noto Serif SC', 'Noto Sans SC', serif;
  font-size: 22px;
  font-weight: 500;
  color: #1c1c1e;
  letter-spacing: 2px;
}
.section-head .line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(180,140,90,0.4), transparent);
}

.gallery {
  column-count: 3;
  column-gap: 20px;
}
.gallery-item {
  position: relative;
  display: block;
  width: 100%;
  border: none;
  padding: 0;
  margin: 0 0 20px;
  background: rgba(255,255,255,0.55);
  border-radius: 18px;
  overflow: hidden;
  cursor: zoom-in;
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  transition: transform 0.25s, box-shadow 0.25s;
}
.gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.10);
}
.gallery-item img {
  display: block;
  width: 100%;
  height: auto;
}
.gallery-item .cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 28px 16px 12px;
  font-size: 13px;
  color: #fff;
  text-align: left;
  background: linear-gradient(transparent, rgba(0,0,0,0.55));
  opacity: 0;
  transition: opacity 0.25s;
}
.gallery-item:hover .cap { opacity: 1; }

.lightbox {
  position: fixed; inset: 0; z-index: 999;
  display: none;
  align-items: center; justify-content: center;
  background: rgba(18,18,22,0.92);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 32px;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.lightbox .close {
  position: absolute; top: 20px; right: 24px;
  width: 40px; height: 40px;
  font-size: 22px; line-height: 1;
  color: #fff; background: rgba(255,255,255,0.12);
  border: none; border-radius: 50%;
  cursor: pointer;
  transition: background 0.2s;
}
.lightbox .close:hover { background: rgba(255,255,255,0.24); }
.lightbox .nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  font-size: 20px; line-height: 1;
  color: #fff; background: rgba(255,255,255,0.12);
  border: none; border-radius: 50%;
  cursor: pointer;
  transition: background 0.2s;
}
.lightbox .nav:hover { background: rgba(255,255,255,0.24); }
.lightbox .prev { left: 20px; }
.lightbox .next { right: 20px; }
.lightbox .counter {
  position: absolute; bottom: 22px; left: 0; right: 0;
  text-align: center;
  font-size: 13px; color: rgba(255,255,255,0.7);
  letter-spacing: 1px;
}

.footer {
  font-size: 14px; color: #a1a1aa;
  padding-top: 40px;
  text-align: center;
}

@media (max-width: 768px) {
  .gallery { column-count: 2; column-gap: 12px; }
  .gallery-item { margin-bottom: 12px; border-radius: 14px; }
  .hero h1 { font-size: 34px; }
  .hero { padding: 48px 0 32px; }
  .container { padding: 0 20px 80px; }
  .navbar { padding: 0 16px; }
  .lightbox { padding: 16px; }
}
@media (max-width: 480px) {
  .gallery { column-count: 1; }
}
</style>
</head>
<body>

<div class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-name">阿金</a>
    <div class="nav-right">
      <a href="index.html#projects" class="nav-link">项目</a>
      <a href="index.html#creative" class="nav-link">创作</a>
      <a href="index.html#skills" class="nav-link">能力</a>
      <a href="gallery.html" class="nav-link active">图册</a>
      <a href="index.html#contact" class="nav-link">联系</a>
    </div>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1>图册</h1>
    <p class="sub">随手画的、随手存的。点开看大图。</p>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="label">插画</span>
      <span class="line"></span>
    </div>
    <div class="gallery" id="gallery">

      <button class="gallery-item" data-src="tuce/output7_2k_11.png" data-cap="白">
        <img src="tuce/output7_2k_11.png" alt="白" loading="lazy" width="2048" height="2048">
        <span class="cap">白 · 2048×2048</span>
      </button>

      <button class="gallery-item tall" data-src="tuce/output30_4k_916.png" data-cap="生日">
        <img src="tuce/output30_4k_916.png" alt="生日" loading="lazy" width="2160" height="3840">
        <span class="cap">生日 · 2160×3840</span>
      </button>

      <button class="gallery-item" data-src="tuce/output12_4k_34.png" data-cap="伸懒腰">
        <img src="tuce/output12_4k_34.png" alt="伸懒腰" loading="lazy" width="2304" height="3072">
        <span class="cap">伸懒腰 · 2304×3072</span>
      </button>

      <button class="gallery-item" data-src="tuce/output22_4k_34.png" data-cap="两个人">
        <img src="tuce/output22_4k_34.png" alt="两个人" loading="lazy" width="2304" height="3072">
        <span class="cap">两个人 · 2304×3072</span>
      </button>

      <button class="gallery-item wide" data-src="tuce/profile.jpg" data-cap="头像">
        <img src="tuce/profile.jpg" alt="头像" loading="lazy" width="648" height="648">
        <span class="cap">头像 · 648×648</span>
      </button>

    </div>
  </div>

  <div class="footer">
    <span>阿金 · 2026</span>
  </div>

</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose" aria-label="关闭">×</button>
  <button class="nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <button class="nav next" id="lbNext" aria-label="下一张">›</button>
  <img id="lbImg" src="" alt="">
  <div class="counter" id="lbCounter"></div>
</div>

<script>
var items = Array.prototype.slice.call(document.querySelectorAll('.gallery-item'));
var lb = document.getElementById('lightbox');
var lbImg = document.getElementById('lbImg');
var lbCounter = document.getElementById('lbCounter');
var idx = 0;

function show(i) {
  idx = (i + items.length) % items.length;
  var el = items[idx];
  lbImg.src = el.getAttribute('data-src');
  lbImg.alt = el.getAttribute('data-cap') || '';
  lbCounter.textContent = (idx + 1) + ' / ' + items.length;
}

function open(i) {
  show(i);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function close() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

items.forEach(function(el, i) {
  el.addEventListener('click', function() { open(i); });
});

document.getElementById('lbClose').addEventListener('click', close);
document.getElementById('lbPrev').addEventListener('click', function(e) { e.stopPropagation(); show(idx - 1); });
document.getElementById('lbNext').addEventListener('click', function(e) { e.stopPropagation(); show(idx + 1); });
lb.addEventListener('click', function(e) {
  if (e.target === lb) close();
});

document.addEventListener('keydown', function(e) {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') show(idx - 1);
  if (e.key === 'ArrowRight') show(idx + 1);
});
</script>

</body>
</html>
